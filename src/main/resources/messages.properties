# Error messages shown to API clients (Problem Details "detail").
# Key: error.<CODE>. Messages with arguments are MessageFormat patterns: no single apostrophes,
# and numbers use {0,number,#} so that ids are not grouped as "1.234".

# Common
error.VALIDATION_FAILED=İstek doğrulanamadı. Ayrıntılar errors alanında.
error.MALFORMED_REQUEST=İstek okunamadı. Gövdeyi ve parametreleri kontrol edin.
error.ACCESS_DENIED=Bu işlem için yetkiniz yok.
error.CONCURRENT_UPDATE=Kayıt siz okuduktan sonra değişti. Yenileyip tekrar deneyin.
error.SERVICE_UNAVAILABLE=Servis geçici olarak kullanılamıyor. Biraz sonra tekrar deneyin.
error.INTERNAL_ERROR=Beklenmeyen bir hata oluştu.

# Security filter chain
error.AUTHENTICATION_REQUIRED=Bu uç nokta için giriş yapmanız gerekiyor.
error.TOKEN_EXPIRED=Erişim belirtecinin süresi doldu. Yenileme yapın.
error.TOKEN_INVALID=Erişim belirteci geçersiz.
error.TOKEN_REVOKED=Erişim belirteci iptal edildi.
error.REFRESH_TOKEN_MISSING=Yenileme belirteci gönderilmedi.
error.CSRF_TOKEN_INVALID=CSRF belirteci eksik ya da hatalı. X-XSRF-TOKEN başlığını gönderin.
error.AUTH_UNAVAILABLE=Kimlik doğrulama servisi geçici olarak kullanılamıyor.

# Common (shared kernel)
error.INVALID_IDENTIFIER=Geçersiz kimlik numarası: {0,number,#}
error.INVALID_EMAIL=Geçerli bir e-posta adresi girin.

# Identity
error.PASSWORD_REQUIRED=Şifre zorunludur.
error.PASSWORD_TOO_SHORT=Şifre en az {0,number,#} karakter olmalıdır.
error.PASSWORD_TOO_LONG=Şifre en fazla {0,number,#} bayt olabilir (Türkçe karakterler 2 bayt sayılır).
error.INVALID_ROLE_NAME=Geçersiz rol adı: {0}
error.INVALID_PERMISSION_NAME=Geçersiz izin adı: {0}
error.INVALID_MEMBERSHIP_LEVEL=Geçersiz üyelik seviyesi.
error.INVALID_CREDENTIALS=E-posta ya da şifre hatalı.
error.TOO_MANY_LOGIN_ATTEMPTS=Çok fazla hatalı giriş denemesi. Bir süre sonra tekrar deneyin.
error.EMAIL_ALREADY_REGISTERED=Bu e-posta adresi zaten kayıtlı.
error.WRONG_CURRENT_PASSWORD=Mevcut şifre hatalı.
error.REFRESH_TOKEN_INVALID=Yenileme belirteci geçersiz. Yeniden giriş yapın.
error.REFRESH_IN_PROGRESS=Bu oturum için başka bir yenileme şu anda yapılıyor. İsteği tekrar deneyin.
error.SESSION_ENDED=Oturum sona erdi. Yeniden giriş yapın.
error.SESSION_NOT_FOUND=Oturum bulunamadı: {0,number,#}
error.ACCOUNT_NOT_FOUND=Hesap bulunamadı: {0,number,#}

# Customer
error.INVALID_PERSON_NAME=Ad ve soyad 1 ile 100 karakter arasında olmalıdır.
error.INVALID_ADDRESS=Adres alanları boş olamaz ve izin verilen uzunluğu aşamaz.
error.CUSTOMER_NOT_FOUND=Müşteri bulunamadı: {0,number,#}
error.ADDRESS_NOT_FOUND=Adres bulunamadı: {0,number,#}
error.ADDRESS_LIMIT_REACHED=En fazla {0,number,#} adres kaydedebilirsiniz.

# Membership
error.INVALID_MEMBERSHIP_PERIOD=Üyelik bitiş zamanı başlangıçtan sonra olmalıdır.
error.MEMBER_NOT_FOUND=Üyelik verilecek müşteri bulunamadı: {0,number,#}
error.MEMBERSHIP_NOT_FOUND=Müşterinin üyeliği yok: {0,number,#}

# Staff
error.INVALID_ADMIN_PROFILE=Yönetici profili geçersiz.
error.ADMIN_PROFILE_NOT_FOUND=Yönetici profili bulunamadı: {0,number,#}

# Content
error.INVALID_ARTICLE=Geçersiz makale bilgisi.
error.ARTICLE_NOT_FOUND=Makale bulunamadı: {0,number,#}
error.ARTICLE_REQUIRES_HIGHER_TIER=Bu makale için en az {0} üyelik gerekiyor.
